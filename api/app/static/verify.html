<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xác minh danh tính</title><style>
body{font:16px system-ui;background:#f0f4f9;color:#17324b;margin:0}main{max-width:650px;margin:32px auto;padding:28px;background:white;border-radius:16px}
button,input{font:inherit;margin:8px 0}button{padding:10px 16px;background:#185c72;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:20px 0}video{max-width:100%;border-radius:8px}#status{white-space:pre-wrap;padding:16px;background:#edf5f7}small{display:block;color:#475569}
</style></head><body><main><h1>Xác minh trước khi vào thi</h1><p id="context">Đang kiểm tra phiên…</p>
<small>Ảnh và giọng nói được xử lý để so khớp hồ sơ đã ghi danh. Kết quả chưa rõ sẽ chuyển giám thị kiểm tra. Bản demo chưa có chống giả mạo/liveness.</small>
<section id="inputs" hidden><label>Ảnh khuôn mặt <input id="face" type="file" accept="image/jpeg,image/png,image/webp" capture="user"></label>
<button id="camera" type="button">Mở camera</button> <button id="capture" type="button" hidden>Chụp ảnh</button><video id="preview" autoplay muted playsinline hidden></video>
<label>Giọng nói WAV (2–10 giây) <input id="voice" type="file" accept="audio/wav"></label>
<button id="record" type="button">Thu âm 5 giây</button><p id="recorded"></p>
<label><input id="consent" type="checkbox"> Tôi đồng ý gửi ảnh và giọng nói để xác minh danh tính cho phiên thi này.</label>
<button id="submit">Gửi xác minh</button></section><p id="status" role="status"></p><a id="return" hidden>Quay lại hệ thống thi</a></main>
<script>
'use strict';
const params=new URLSearchParams(location.hash.slice(1)), sessionId=params.get('session'), token=params.get('token');
history.replaceState(null,'',location.pathname);
const el=id=>document.getElementById(id); let faceBlob=null,voiceBlob=null,cameraStream=null;
async function api(path,options={}){const r=await fetch('/v1/public/sessions/'+encodeURIComponent(sessionId)+path,{...options,headers:{Authorization:'Bearer '+token}});const data=await r.json();if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data;}
async function init(){try{if(!sessionId||!token)throw new Error('Mở liên kết xác minh từ hệ thống thi.');const d=await api('');el('context').textContent=d.organization+' · Ca thi '+d.exam_id;el('inputs').hidden=d.status!=='pending';el('status').textContent=d.status==='pending'?'Phiên có hạn đến '+new Date(d.expires_at).toLocaleString():'Trạng thái: '+d.status;if(d.return_url){el('return').href=d.return_url;el('return').hidden=false;}}catch(e){el('status').textContent=e.message;}}
el('camera').onclick=async()=>{try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});el('preview').srcObject=cameraStream;el('preview').hidden=false;el('capture').hidden=false;}catch(e){el('status').textContent='Không mở được camera: '+e.message;}};
el('capture').onclick=()=>{const v=el('preview'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{faceBlob=b;el('status').textContent='Đã chụp ảnh.';},'image/jpeg');cameraStream.getTracks().forEach(t=>t.stop());v.hidden=true;};
el('record').onclick=async()=>{let stream,ctx;try{el('record').disabled=true;stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new AudioContext();await ctx.resume();const source=ctx.createMediaStreamSource(stream),processor=ctx.createScriptProcessor(4096,1,1),chunks=[];processor.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));source.connect(processor);processor.connect(ctx.destination);el('recorded').textContent='Đang thu… hãy đọc một câu trong 5 giây.';await new Promise(r=>setTimeout(r,5000));processor.disconnect();source.disconnect();const length=chunks.reduce((s,x)=>s+x.length,0),buffer=new ArrayBuffer(44+length*2),view=new DataView(buffer);function text(offset,value){for(let i=0;i<value.length;i++)view.setUint8(offset+i,value.charCodeAt(i));}text(0,'RIFF');view.setUint32(4,36+length*2,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,ctx.sampleRate,true);view.setUint32(28,ctx.sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,length*2,true);let offset=44;for(const chunk of chunks)for(const value of chunk){const sample=Math.max(-1,Math.min(1,value));view.setInt16(offset,sample<0?sample*32768:sample*32767,true);offset+=2;}voiceBlob=new Blob([buffer],{type:'audio/wav'});el('recorded').textContent='Đã thu WAV 5 giây.';}catch(e){el('status').textContent=e.message;}finally{if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)await ctx.close();el('record').disabled=false;}};
el('submit').onclick=async()=>{try{const face=el('face').files[0]||faceBlob,voice=el('voice').files[0]||voiceBlob;if(!face||!voice||!el('consent').checked)throw new Error('Cần ảnh, WAV và sự đồng ý trước khi gửi.');el('submit').disabled=true;el('status').textContent='Đang xác minh…';const form=new FormData();form.append('face_file',face,face.name||'camera.jpg');form.append('voice_file',voice,voice.name||'recording.wav');form.append('consent','true');const d=await api('/verify',{method:'POST',body:form});el('inputs').hidden=true;el('status').textContent=d.status==='allow'?'Xác minh thành công. Quay lại hệ thống thi để tiếp tục.':'Cần giám thị kiểm tra. Quay lại hệ thống thi để theo dõi kết quả.';}catch(e){el('status').textContent=e.message;el('submit').disabled=false;}};
init();
</script></body></html>
