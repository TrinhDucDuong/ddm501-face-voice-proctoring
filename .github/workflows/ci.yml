name: CI
on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy on the approved self-hosted demo runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-api.txt -r requirements-monitoring.txt -r requirements-dev.txt
      - run: ruff check api pipeline monitoring tests legacy_demo
      - run: python -m compileall -q api pipeline monitoring airflow/dags ui legacy_demo
      - run: python pipeline/build_dashboard.py && git diff --exit-code monitoring/grafana/dashboards/biometric-overview.json
      - run: python -m pytest --cov=app --cov=pipeline.evaluation --cov=pipeline.data_snapshot --cov=pipeline.validate_data --cov=pipeline.promotion_gate --cov=pipeline.responsible_ai_report --cov=monitoring --cov-report=term-missing --cov-report=xml --junitxml=reports/tests.xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            coverage.xml
            reports/tests.xml
      - run: cp .env.example .env && docker compose config --quiet

  containers:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build api ui drift-monitor ops-monitor airflow-scheduler webhook-worker legacy-demo

  deploy-demo:
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: [self-hosted, Windows, ddm501-demo]
    needs: containers
    environment: demo
    concurrency:
      group: ddm501-demo
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Use the authorized runtime Python
        run: |
          $runtimePython = Join-Path $env:DDM501_RUNTIME_ROOT '.venv/Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $runtimePython)) { throw 'Runtime Python is missing' }
          & $runtimePython -c "import sys, dotenv, requests; assert sys.version_info >= (3, 10); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Split-Path -Parent $runtimePython | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Reuse authorized local secrets and persistence
        run: |
          $deployPath = python pipeline/prepare_runner_env.py --stage-deployment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DDM501_DEPLOY_PATH=$deployPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: |
          docker compose config --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.DDM501_DEPLOY_PATH }}
      - run: |
          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.DDM501_DEPLOY_PATH }}
      - name: Smoke test
        working-directory: ${{ env.DDM501_DEPLOY_PATH }}
        run: |
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              $null = Invoke-RestMethod http://localhost:18100/ready
              exit 0
            } catch { Start-Sleep -Seconds 10 }
          }
          docker compose ps
          exit 1
      - name: Monitoring smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $null = Invoke-WebRequest -UseBasicParsing http://localhost:18001/metrics
          $null = Invoke-WebRequest -UseBasicParsing http://localhost:18003/metrics/
          $null = Invoke-WebRequest -UseBasicParsing http://localhost:19090/-/ready
          $null = Invoke-RestMethod http://localhost:13000/api/health
      - name: Verify Grafana dashboard and protected reports
        working-directory: ${{ env.DDM501_DEPLOY_PATH }}
        run: |
          python pipeline/verify_monitoring_centre.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-monitoring-evidence
          path: ${{ env.DDM501_DEPLOY_PATH }}/reports/monitoring-verification.json
