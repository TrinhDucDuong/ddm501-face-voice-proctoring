name: CI
on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy on the approved self-hosted demo runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-api.txt -r requirements-monitoring.txt -r requirements-dev.txt
      - run: ruff check api pipeline monitoring tests legacy_demo
      - run: python -m compileall -q api pipeline monitoring airflow/dags ui legacy_demo
      - run: python pipeline/build_dashboard.py && git diff --exit-code monitoring/grafana/dashboards/biometric-overview.json
      - run: python -m pytest --cov=app --cov=pipeline.evaluation --cov=pipeline.data_snapshot --cov=pipeline.validate_data --cov=pipeline.promotion_gate --cov=pipeline.responsible_ai_report --cov=monitoring --cov-report=term-missing --cov-report=xml --junitxml=reports/tests.xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            coverage.xml
            reports/tests.xml
      - run: cp .env.example .env && docker compose config --quiet

  deployment-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest==9.1.1 python-dotenv==1.0.1
      - name: Run isolated Windows deployment tests
        run: python -m pytest tests/test_deploy_local.py -v -rs --junitxml=reports/deployment-preflight-tests.xml
      - name: Require executed tests with no skips
        if: always()
        shell: pwsh
        run: |
          [xml]$report = Get-Content reports/deployment-preflight-tests.xml
          $cases = @($report.SelectNodes('//testcase'))
          if ($cases.Count -lt 2 -or $report.SelectNodes('//skipped|//failure|//error').Count -gt 0) {
            throw 'Deployment preflight tests must execute and pass without skips.'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-preflight-evidence
          path: reports/deployment-preflight-tests.xml
          if-no-files-found: error

  containers:
    runs-on: ubuntu-latest
    needs: [quality, deployment-preflight]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build api ui drift-monitor ops-monitor airflow-scheduler webhook-worker legacy-demo

  deploy-demo:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: [self-hosted, Linux, ddm501-linux-demo]
    needs: containers
    environment: demo
    concurrency:
      group: ddm501-demo
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify on local Docker Desktop
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DDM501_RUNTIME_ROOT:-}"
          test -n "${DDM501_WINDOWS_CHECKOUT_ROOT:-}"
          test -f "$DDM501_RUNTIME_ROOT/.env"
          for attempt in $(seq 1 60); do
            if docker.exe info >/dev/null 2>&1; then break; fi
            sleep 5
          done
          docker.exe info >/dev/null
          windows_checkout="$DDM501_WINDOWS_CHECKOUT_ROOT/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$windows_checkout"
          cp -r "$GITHUB_WORKSPACE/." "$windows_checkout/"
          script="$(wslpath -w "$windows_checkout/pipeline/deploy_local.ps1")"
          workspace="$(wslpath -w "$windows_checkout")"
          runtime="$(wslpath -w "$(realpath "$DDM501_RUNTIME_ROOT")")"
          result=0
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "$script" -Workspace "$workspace" -RuntimeRoot "$runtime" -Revision "$GITHUB_SHA" || result=$?
          if test -f "$windows_checkout/reports/deployment-monitoring-verification.json"; then
            mkdir -p "$GITHUB_WORKSPACE/reports"
            cp "$windows_checkout/reports/deployment-monitoring-verification.json" \
              "$GITHUB_WORKSPACE/reports/deployment-monitoring-verification.json"
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-monitoring-evidence
          path: reports/deployment-monitoring-verification.json
