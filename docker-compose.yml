name: ${COMPOSE_PROJECT_NAME:-ddm501-biometric-demo}

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biometric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biometric_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-biometric}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    ports: ["127.0.0.1:15433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biometric} -d ${POSTGRES_DB:-biometric}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    volumes: ["minio-data:/data"]
    ports: ["127.0.0.1:19100:9000", "127.0.0.1:19101:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  create-buckets:
    image: python:3.11-slim
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
      BIOMETRIC_BUCKET: ${BIOMETRIC_BUCKET:-biometric-samples}
    command:
      - /bin/sh
      - -ec
      - |
        pip install --no-cache-dir boto3==1.38.23
        python -c "import os,boto3; c=boto3.client('s3',endpoint_url='http://minio:9000',aws_access_key_id=os.environ['MINIO_ROOT_USER'],aws_secret_access_key=os.environ['MINIO_ROOT_PASSWORD']); existing={x['Name'] for x in c.list_buckets().get('Buckets',[])}; [c.create_bucket(Bucket=b) for b in (os.environ['MLFLOW_BUCKET'],os.environ['BIOMETRIC_BUCKET']) if b not in existing]; print(c.list_buckets())"
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    depends_on:
      postgres: {condition: service_healthy}
      create-buckets: {condition: service_completed_successfully}
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    command: >-
      sh -c "pip install --no-cache-dir psycopg2-binary boto3 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD:-biometric_dev_only}@postgres:5432/mlflow
      --default-artifact-root s3://${MLFLOW_BUCKET:-mlflow}/"
    ports: ["127.0.0.1:15030:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  model-init:
    build:
      context: .
      dockerfile: api/Dockerfile
      args: {INSTALL_PRETRAINED: "true"}
    command: python pipeline/download_models.py
    environment:
      MODEL_DIR: /models
    volumes: ["./models:/models"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args: {INSTALL_PRETRAINED: "true"}
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}
      model-init: {condition: service_completed_successfully}
    env_file: .env
    environment:
      MODEL_DIR: /models
      MINIO_ENDPOINT: http://minio:9000
    volumes: ["./models:/models"]
    ports: ["127.0.0.1:18100:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      api: {condition: service_healthy}
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-demo-internal-key}
    ports: ["127.0.0.1:18501:8501"]
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
    user: "0:0"
    env_file: .env
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD:-biometric_dev_only}@postgres:5432/airflow
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD:-biometric_dev_only}@postgres:5432/${POSTGRES_DB:-biometric}
      AIRFLOW__WEBSERVER__SECRET_KEY: ddm501-demo-secret-key
      API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/project
    command: >-
      bash -c "mkdir -p /opt/airflow/logs && chown -R 50000:0 /opt/airflow/logs &&
      airflow db migrate &&
      airflow users create --username $${_AIRFLOW_WWW_USER_USERNAME:-admin}
      --password $${_AIRFLOW_WWW_USER_PASSWORD:-admin} --firstname DDM --lastname Admin
      --role Admin --email admin@example.local || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    env_file: .env
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports: ["127.0.0.1:18081:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    env_file: .env
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.0
    depends_on: [api]
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:19090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.1
    depends_on: [prometheus, postgres]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biometric_dev_only}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:13000:3000"]
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  grafana-data:
