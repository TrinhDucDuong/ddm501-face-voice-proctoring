name: ${COMPOSE_PROJECT_NAME:-ddm501-biometric-demo}

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biometric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biometric_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-biometric}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    ports: ["127.0.0.1:15433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biometric} -d ${POSTGRES_DB:-biometric}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    volumes: ["minio-data:/data"]
    ports: ["127.0.0.1:19100:9000", "127.0.0.1:19101:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  create-buckets:
    image: python:3.11-slim
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
      BIOMETRIC_BUCKET: ${BIOMETRIC_BUCKET:-biometric-samples}
    command:
      - /bin/sh
      - -ec
      - |
        pip install --no-cache-dir boto3==1.38.23
        python -c "import os,boto3; c=boto3.client('s3',endpoint_url='http://minio:9000',aws_access_key_id=os.environ['MINIO_ROOT_USER'],aws_secret_access_key=os.environ['MINIO_ROOT_PASSWORD']); existing={x['Name'] for x in c.list_buckets().get('Buckets',[])}; [c.create_bucket(Bucket=b) for b in (os.environ['MLFLOW_BUCKET'],os.environ['BIOMETRIC_BUCKET']) if b not in existing]; print(c.list_buckets())"
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    depends_on:
      postgres: {condition: service_healthy}
      create-buckets: {condition: service_completed_successfully}
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    command: >-
      sh -c "pip install --no-cache-dir psycopg2-binary boto3 &&
      mlflow server --host 0.0.0.0 --port 5000 --workers ${MLFLOW_WORKERS:-1}
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD:-biometric_dev_only}@postgres:5432/mlflow
      --default-artifact-root s3://${MLFLOW_BUCKET:-mlflow}/"
    ports: ["127.0.0.1:15030:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  model-init:
    build:
      context: .
      dockerfile: api/Dockerfile
      args: {INSTALL_PRETRAINED: "true"}
    command: python pipeline/download_models.py
    user: "0:0"
    environment:
      MODEL_DIR: /models
    volumes: ["${MODELS_PATH:-./models}:/models"]
    restart: "no"

  api:
    networks: [default, simulation-lab]
    build:
      context: .
      dockerfile: api/Dockerfile
      args: {INSTALL_PRETRAINED: "true"}
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}
      model-init: {condition: service_completed_successfully}
    env_file: ${ENV_FILE:-.env}
    environment:
      MODEL_DIR: /models
      MINIO_ENDPOINT: http://minio:9000
      ENABLE_SIMULATION: ${ENABLE_SIMULATION:-true}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:18100}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-legacy-demo,localhost,127.0.0.1}
      SIMULATION_SERVICE_URL: http://simulation:8000
      SIMULATION_SERVICE_KEY: ${SIMULATION_SERVICE_KEY:-local-synthetic-demo}
    volumes: ["${MODELS_PATH:-./models}:/models", "${REPORTS_PATH:-./reports}:/reports:ro"]
    ports: ["127.0.0.1:18100:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      api: {condition: service_healthy}
    environment:
      API_URL: http://api:8000
      PORTAL_LINKS_JSON: ${PORTAL_LINKS_JSON:-}
    ports: ["127.0.0.1:18501:8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  simulation:
    networks: [simulation-lab]
    build:
      context: .
      dockerfile: api/Dockerfile
      args: {INSTALL_PRETRAINED: "false"}
    command: uvicorn app.simulation_server:application --factory --host 0.0.0.0 --port 8000 --workers 1
    environment:
      SIMULATION_ROOT: /srv/data/simulation
      SIMULATION_KEY: ${SIMULATION_SERVICE_KEY:-local-synthetic-demo}
      DATABASE_URL: sqlite:////srv/data/simulation/unused.sqlite
      MLFLOW_TRACKING_URI: file:///srv/data/simulation/mlruns
    volumes: ["simulation-data:/srv/data/simulation"]
    cpus: 1.0
    mem_limit: 1536m
    restart: unless-stopped

  simulation-mlflow:
    networks: [simulation-lab, simulation-ui]
    build:
      context: .
      dockerfile: api/Dockerfile
      args: {INSTALL_PRETRAINED: "false"}
    command: mlflow server --host 0.0.0.0 --port 8000 --workers 1 --backend-store-uri file:///srv/data/simulation/mlruns
    volumes: ["simulation-data:/srv/data/simulation"]
    ports: ["127.0.0.1:15031:8000"]
    cpus: 0.5
    mem_limit: 768m
    restart: unless-stopped

  webhook-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: python -m app.webhooks
    env_file: ${ENV_FILE:-.env}
    environment:
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-legacy-demo,localhost,127.0.0.1}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/metrics"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["127.0.0.1:18002:8002"]
    restart: unless-stopped

  legacy-demo:
    build:
      context: .
      dockerfile: legacy_demo/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      API_URL: http://api:8000
      SAAS_CONFIG: /config/local-saas.json
    volumes:
      - ${DATA_PATH:-./data}:/config:ro
      - legacy-data:/data
    ports: ["127.0.0.1:18600:8000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
    user: "0:0"
    env_file: ${ENV_FILE:-.env}
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-1}
      PYTHONPATH: /opt/project
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW__WEBSERVER__WORKERS: ${AIRFLOW_WEBSERVER_WORKERS:-1}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD:-biometric_dev_only}@postgres:5432/airflow
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD:-biometric_dev_only}@postgres:5432/${POSTGRES_DB:-biometric}
      AIRFLOW__WEBSERVER__SECRET_KEY: ddm501-demo-secret-key
      API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: http://minio:9000
      TRAINING_TENANT_ID: ${TRAINING_TENANT_ID:-demo}
      CONTINUOUS_TRAINING_ENABLED: ${CONTINUOUS_TRAINING_ENABLED:-true}
      SIMULATION_SERVICE_URL: http://simulation:8000
      SIMULATION_KEY: ${SIMULATION_SERVICE_KEY:-local-synthetic-demo}
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags:ro
      - ${AIRFLOW_LOGS_PATH:-./airflow/logs}:/opt/airflow/logs
      - ./:/opt/project
      - ${DATA_PATH:-./data}:/opt/project/data
    command: >-
      bash -c "mkdir -p /opt/airflow/logs && chown -R 50000:0 /opt/airflow/logs &&
      airflow db migrate &&
      airflow users create --username $${_AIRFLOW_WWW_USER_USERNAME:-admin}
      --password $${_AIRFLOW_WWW_USER_PASSWORD:-admin} --firstname DDM --lastname Admin
      --role Admin --email admin@example.local || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    env_file: ${ENV_FILE:-.env}
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports: ["127.0.0.1:18081:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  airflow-scheduler:
    networks: [default, simulation-lab]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    env_file: ${ENV_FILE:-.env}
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 15s
      retries: 5
    restart: unless-stopped

  prometheus:
    networks: [default, simulation-lab]
    image: prom/prometheus:v3.4.0
    depends_on: [api, drift-monitor, alertmanager]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:19090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  drift-monitor:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      api: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD:-biometric_dev_only}@postgres:5432/${POSTGRES_DB:-biometric}
      MONITOR_WINDOW_SIZE: ${MONITOR_WINDOW_SIZE:-100}
      PERFORMANCE_WINDOW_SIZE: ${PERFORMANCE_WINDOW_SIZE:-100}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      PSI_ALERT_THRESHOLD: ${PSI_ALERT_THRESHOLD:-0.2}
      EVIDENTLY_REPORT: /reports/data-drift.html
    volumes: ["${REPORTS_PATH:-./reports}:/reports"]
    ports: ["127.0.0.1:18001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alertmanager:
    networks: [default, simulation-lab]
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:19093:9093"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.1
    depends_on: [prometheus, postgres]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biometric_dev_only}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/biometric-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana-gateway:
    image: nginx:1.28-alpine
    depends_on:
      grafana: {condition: service_healthy}
    ports: ["127.0.0.1:13000:80"]
    volumes:
      - ./monitoring/nginx/grafana.conf:/etc/nginx/conf.d/default.conf:ro
      - ${REPORTS_PATH:-./reports}:/srv/reports:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ops-monitor:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    command: uvicorn monitoring.ops_monitor:app --host 0.0.0.0 --port 8003
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD:-biometric_dev_only}@postgres:5432/${POSTGRES_DB:-biometric}
      AIRFLOW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD:-biometric_dev_only}@postgres:5432/airflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TRAINING_TENANT_ID: ${TRAINING_TENANT_ID:-demo}
      REPORT_DIR: /reports
      MONITORING_SUMMARY_PATH: /data/monitoring/latest.json
    volumes:
      - "${REPORTS_PATH:-./reports}:/reports"
      - "${DATA_PATH:-./data}:/data:ro"
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:18003:8003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  docker-observer:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      INFO: "1"
      VERSION: "1"
      NETWORKS: "1"
      POST: "0"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.0
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-ddm501-biometric-demo}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    depends_on: [loki, docker-observer]
    restart: unless-stopped

networks:
  simulation-ui:
  simulation-lab:
    internal: true

volumes:
  simulation-data:
  postgres-data:
  minio-data:
  grafana-data:
  legacy-data:
  loki-data:
  alloy-data:
