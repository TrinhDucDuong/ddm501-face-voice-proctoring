global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ops-monitor
    metrics_path: /metrics/
    static_configs:
      - targets: ["ops-monitor:8003"]
  - job_name: webhook-worker
    static_configs:
      - targets: ["webhook-worker:8002"]
  - job_name: biometric-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
  - job_name: drift-monitor
    static_configs:
      - targets: ["drift-monitor:8001"]
