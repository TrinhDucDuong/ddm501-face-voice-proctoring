apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Biometric PostgreSQL
    uid: biometric-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: biometric
    jsonData:
      database: biometric
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $POSTGRES_PASSWORD
    editable: false

