server {
    listen 80;
    client_max_body_size 5m;
    location = /health { return 200 "ok\n"; }
    location = /_grafana_auth {
        internal;
        proxy_pass http://grafana:3000/api/user;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }
    location ~ ^/reports/(data-drift|model-performance|synthetic-performance|data-quality|model-evaluation|pipeline-status|responsible-ai|alerts)\.(html|json)$ {
        auth_request /_grafana_auth;
        root /srv;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }
    location /reports/ { return 404; }
    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
